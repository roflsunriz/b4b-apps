version: 2
updates:
  - package-ecosystem: pip
    directory: "/comment-sender"
    schedule:
      interval: cron
      cronjob: "0 0 28 * *"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: "/player-jiggle"
    schedule:
      interval: cron
      cronjob: "0 0 28 * *"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 0 28 * *"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
